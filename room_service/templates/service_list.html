{% extends 'base.html' %}


{% block content %}
<h1>Room Service Menu</h1>

<table>
    <tr>
        <th>Room</th>
        <th>Service</th>
        <th>Description</th>
        <th>Price</th>
    </tr>
    {% for service in services %}
    <tr>
        <td>{{ service.room_number }}</td>
        <td><a href="{% url 'service_detail' service.pk %}">{{ service.service_type }}</a></td>
        <td>{{ service.description|truncatewords:10 }}</td>
        <td>{{ service.price }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
